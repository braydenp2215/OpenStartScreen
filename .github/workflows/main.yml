name: Build OpenStartScreen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild OpenStartScreen.sln /p:Configuration=Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpenStartScreen
          path: |
            **\bin\Release\*.exe
